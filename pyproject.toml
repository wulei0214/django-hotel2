[tool.ruff]
line-length = 100
target-version = "py39"
src = ["apps", "hotel"]
exclude = [".venv", "venv", "migrations", "__pycache__", "static", "staticfiles", "hotelapp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "hotel"]
force-single-line = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
"apps/*/migrations/*" = ["E", "F"]

[tool.black]
line-length = 100
target-version = ["py39"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.9"
mypy_path = "apps:hotel"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["migrations", ".venv", "venv", "hotelapp"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "tests.py"]
testpaths = ["apps", "tests"]
DJANGO_SETTINGS_MODULE = "hotel.settings"
filterwarnings = ["ignore::DeprecationWarning"]
# 默认排除 p0 冒烟用例（真实 HTTP，需已启动实例）；冒烟跑法：
#   pytest apps/api/tests_p0 -m p0  （CLI 的 -m 覆盖此处默认值）
addopts = "-ra --strict-markers -m 'not p0'"
markers = [
  "p0: P0 链路真实 HTTP 冒烟用例（需已启动且完成演示数据种子的实例，见 apps/api/tests_p0/README.md）",
]
