repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(apps|hotel)/.+\.py$
      - id: ruff-format
        files: ^(apps|hotel)/.+\.py$

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        files: ^(apps|hotel)/.+\.py$

  # mypy 触碰文件门禁（本地层，语义与 CI 基线门禁对齐：触碰文件不得引入超出
  # 基线的错误）。用本地钩子而非 mirrors-mypy 远程钩子：直接使用项目 .venv 的
  # mypy 1.11.2 与 pyproject [tool.mypy] 配置，与 CI 同版本同配置（此前远程钩子
  # 的隔离环境与 CI 存在解释器/依赖差异，语义不一致）。脚本对 mypy 缺失/工具
  # 失败 fail-closed 阻断，并在需要时自动转入 .venv 解释器重执行。
  - repo: local
    hooks:
      - id: mypy-baseline-touched
        name: mypy baseline (touched files must not add errors)
        entry: python scripts/mypy_baseline.py check-files
        language: system
        files: ^(apps|hotel)/.+\.py$
      - id: pytest-check
        name: pytest
        entry: pytest -q
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]
