<!-- 员工登录页：左右分栏（左品牌区/右表单区）；登录后按安全校验的 ?next= 回跳。
     顾客自注册与预订走 /booking/ 与 /reserve/，不再出现在员工入口。 -->
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>员工登录 - 酒店管理系统</title>
    <link rel="stylesheet" href="/static/css/site.css?v=14">
    <link rel="stylesheet" href="/static/css/login_page.css?v=4">
</head>
<body class="login-body">
<div class="login-split">
    <div class="login-brand">
        <div class="login-brand-logo">酒</div>
        <h1 class="login-brand-name">酒店管理系统</h1>
        <p class="login-brand-slogan">PMS · 酒店运营平台</p>
        <ul class="login-brand-points">
            <li>预订 · 排房 · 入住 · 退房 全流程</li>
            <li>客人档案与会员关系统一管理</li>
            <li>财务账本与夜审日结</li>
        </ul>
        <p class="login-brand-foot">员工专用入口 · 按物业任职与岗位授权显示功能</p>
    </div>
    <div class="login-pane">
        <form class="login-form" action="/login/" method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <h2 class="login-form-title">员工登录</h2>
            <p class="login-form-sub">请使用员工账号进入工作台</p>
            {% if activated %}<p class="login-ok" role="status">账号已激活，请使用您设置的密码登录。</p>{% endif %}
            {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
            <label class="login-label" for="login-username">员工账号</label>
            <input id="login-username" class="login-input" type="text" name="username" autocomplete="username" placeholder="员工账号" required autofocus>
            <label class="login-label" for="login-password">登录密码</label>
            <div class="login-pass-wrap">
                <input id="login-password" class="login-input" type="password" name="password" autocomplete="current-password" placeholder="登录密码" required>
                <button type="button" class="login-pass-toggle" aria-label="显示或隐藏密码">显示</button>
            </div>
            <button type="submit" class="login-btn">登 录</button>
            <p class="login-form-foot">忘记密码或需要开通账号，请联系店长或系统管理员。</p>
        </form>
    </div>
</div>
<script>
(function () {
    var toggle = document.querySelector(".login-pass-toggle");
    if (toggle) {
        toggle.addEventListener("click", function () {
            var input = document.getElementById("login-password");
            var show = input.type === "password";
            input.type = show ? "text" : "password";
            toggle.textContent = show ? "隐藏" : "显示";
        });
    }
    var form = document.querySelector(".login-form");
    if (form) {
        form.addEventListener("submit", function () {
            var btn = form.querySelector(".login-btn");
            if (btn) { btn.classList.add("is-loading"); btn.disabled = true; }
        });
    }
})();
</script>
</body>
</html>
