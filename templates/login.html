<!-- 前台独立登录页：登录后按 ?next= 回到原页面；账号见 README 角色表 -->
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>登录 - 酒店管理系统</title>
    <link rel="stylesheet" href="/static/css/site.css?v=12">
    <link rel="stylesheet" href="/static/css/login_page.css?v=3">
<script src="/static/js/app.js?v=2"></script>
</head>
<body class="login-body">
<div class="login-wrap">
    <div class="login-card">
        <div class="login-logo">酒</div>
        <h2>酒店管理系统</h2>
        <p class="login-sub">请使用员工账号登录（前台 / 值班经理 / 财务 / 店长）</p>
        {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
        <form action="/login/" method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <p><label>用户名：</label><input type="text" name="username" autocomplete="username" class="input" placeholder="员工账号" required autofocus></p>
            <p><label>密&nbsp;&nbsp;码：</label><input type="password" name="password" autocomplete="current-password" class="input" autocomplete="current-password" placeholder="密码" required></p>
            <p><button type="submit" class="login-btn">登 录</button></p>
        </form>
        <p class="login-foot">还没有账号？<a href="/register/">注册账号</a>&nbsp;&nbsp;·&nbsp;&nbsp;<a href="/booking/">顾客预订</a></p>
    </div>
</div>
</body>
</html>
