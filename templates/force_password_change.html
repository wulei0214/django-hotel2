<!-- 首次登录/密码重置后强制改密（D-07） -->
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>修改密码 - 酒店管理系统</title>
    <link rel="stylesheet" href="/static/css/site.css?v=12">
    <style>
        .force-card {
            max-width: 420px;
            margin: 12vh auto;
            background: var(--color-bg-surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: 32px 36px;
        }
        .force-card h2 { margin: 0 0 6px; font-size: var(--text-title); color: var(--color-text-primary); }
        .force-card p { margin: 0 0 18px; font-size: var(--text-caption); color: var(--color-text-secondary); }
        .force-card input { width: 100%; box-sizing: border-box; margin-bottom: 14px; padding: 10px 12px;
            border: 1px solid var(--color-border-default); border-radius: var(--radius-sm); font-size: var(--text-body); }
        .force-card button { width: 100%; padding: 11px 0; background: var(--color-accent-solid);
            color: var(--color-text-inverse); border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-body); }
        .force-err { background: var(--color-danger-solid); color: var(--color-text-inverse);
            padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 14px; font-size: var(--text-caption); }
    </style>
</head>
<body>
<div class="force-card">
    <h2>请设置新密码</h2>
    <p>您的账号正在使用初始密码或刚被管理员重置密码，为保障安全请先设置新密码。</p>
    {% if error %}<div class="force-err">{{ error }}</div>{% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="password" name="new_password1" placeholder="新密码（至少 6 位）" required autofocus>
        <input type="password" name="new_password2" placeholder="确认新密码" required>
        <button type="submit">确认修改</button>
    </form>
</div>
</body>
</html>
