<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>无权限 - 酒店管理系统</title>
    <link rel="stylesheet" href="/static/css/site.css?v=10">
</head>
<body>
<div class="page" style="margin-left:0">
    <div class="card" style="text-align:center; padding:60px 32px;">
        <h2>403 · 没有访问权限</h2>
        <p style="margin:24px 0; color:#606266;">

        </p>
        <a href="/" style="color:#409EFF; text-decoration:none;">返回我有权限的首页</a>
        &nbsp;&nbsp;|&nbsp;&nbsp;

</div>

</html>
