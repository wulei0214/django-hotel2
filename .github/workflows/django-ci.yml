name: Django CI

on:
  push:
    branches:
      - main
      - "pms2/**"
  pull_request:
    branches:
      - main

jobs:
  lint:
    # 多 AI 协作治理方案 附录#9：lint 门禁。
    # 差异范围策略：只检查本次变更的 apps/、hotel/ 下 .py 文件——
    # 存量文件保持原状，谁改动谁负责清理（与 pre-commit 同口径）。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install linters
        run: pip install ruff==0.6.9 black==24.8.0
      - name: Collect changed Python files (apps/ or hotel/)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              --diff-filter=ACMR -- apps hotel | grep '\.py$' > changed_py.txt || true
          else
            git diff --name-only "HEAD~1" \
              --diff-filter=ACMR -- apps hotel | grep '\.py$' > changed_py.txt || true
          fi
          # 仅保留本次检出中仍存在的文件（排除已删除文件）
          while IFS= read -r f; do [ -f "$f" ] && printf '%s\n' "$f"; done \
            < changed_py.txt > existing_py.txt || true
          echo "Changed Python files:"; cat existing_py.txt
      - name: Ruff (changed files must be clean)
        run: |
          if [ -s existing_py.txt ]; then
            xargs -a existing_py.txt ruff check
          else
            echo "No changed Python files under apps/ or hotel/ — ruff skipped"
          fi
      - name: Black format check (changed files)
        run: |
          if [ -s existing_py.txt ]; then
            xargs -a existing_py.txt black --check
          else
            echo "No changed Python files under apps/ or hotel/ — black check skipped"
          fi

  type-check:
    # mypy 基线门禁（治理 V1.1 第二阶段，P-04）：存量错误冻结于 mypy-baseline.txt，
    # 仅拦截"新增"错误；存量清偿后由 scripts/mypy_baseline.py generate 重新收紧。
    # 禁止清空/手改基线文件伪造通过（基线变更须随真实清偿提交并说明范围）。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Mypy baseline check (new errors are blocking)
        run: python scripts/mypy_baseline.py check

  test:
    runs-on: ubuntu-24.04
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DB_ENGINE: sqlite
      DJANGO_DB_NAME: ":memory:"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DEFAULT_PROPERTY_CODE: DEFAULT
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test --verbosity 2

  docs-lint:
    # 文档治理阶段三批次 5：docs 链接门禁（C1）。存量断链冻结于
    # docs/共享规范/docs_gate_baseline.json，仅拦截新增断链；
    # 基线更新须与修复同一提交（修一条删一条），禁止清空基线伪造通过。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Docs link check (new broken links are blocking)
        run: python scripts/docs_link_check.py check
