name: Django CI

on:
  push:
    branches:
      - main
      - "pms2/**"
  pull_request:
    branches:
      - main

jobs:
  secret-scan:
    # TASK-04 凭据泄露整改 + V12-06 范围增强：凭据治理门禁接入 CI。
    # 扫描范围自 V12-06 起扩至全仓受控文本（业务源码/前端/配置/settings/
    # 数据库配置/CI 工作流/部署脚本/文档与脚本），不再只扫 docs/ 与 scripts/；
    # `.env`/私钥/二进制/依赖与构建产物/Git 历史按独立策略处理（见脚本内
    # EXCLUDED_DIRS 与 tracked-* 规则，理由随代码留档）。
    # 命中即退出码 1 阻断；白名单仅允许（文件, 规则）精确豁免且必须写明复核理由。
    # 口径：口令只允许存在于 gitignore 的 scripts/r6_env.txt 与环境变量。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Secret literal scan (whole repository)
        # 管道会覆盖扫描器退出码（tee 恒返回 0）：0d865eb 的 run 实测
        # hit_count=1 而 job 仍报 success，属门禁假绿。此处显式开启
        # pipefail，命中时整条管道以 1 失败，保留 JSON 报告供上传。
        shell: bash
        run: |
          set -euo pipefail
          python scripts/scan_secrets.py --json | tee secret-scan-report.json
      - name: Scan self-test (mock credential must block)
        # 反向验证：扫描器必须对模拟密钥返回退出码 1，防止"永远通过"的空转门禁。
        # 样例密钥在运行时拼装，避免本工作流自身被扫描器命中（自伤式误报）。
        run: |
          mkdir -p "$RUNNER_TEMP/secret-selftest"
          printf 'aws_access_key_id = "%s%s"\n' "AKIA" "ABCDEFGHIJKLMNOP" \
            > "$RUNNER_TEMP/secret-selftest/mock_credential.py"
          set +e
          python scripts/scan_secrets.py "$RUNNER_TEMP/secret-selftest"
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "扫描器未拦截模拟密钥（退出码 $code）：门禁失效"
            exit 1
          fi
          echo "反向验证通过：模拟密钥被拦截（退出码 1）"
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-report
          path: secret-scan-report.json

  lint:
    # 多 AI 协作治理方案 附录#9：lint 门禁。
    # 差异范围策略：只检查本次变更的 apps/、hotel/ 下 .py 文件——
    # 存量文件保持原状，谁改动谁负责清理（与 pre-commit 同口径）。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install linters
        run: pip install ruff==0.6.9 black==24.8.0
      - name: Collect changed Python files (apps/ or hotel/)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              --diff-filter=ACMR -- apps hotel | grep '\.py$' > changed_py.txt || true
          else
            git diff --name-only "HEAD~1" \
              --diff-filter=ACMR -- apps hotel | grep '\.py$' > changed_py.txt || true
          fi
          # 仅保留本次检出中仍存在的文件（排除已删除文件）
          while IFS= read -r f; do [ -f "$f" ] && printf '%s\n' "$f"; done \
            < changed_py.txt > existing_py.txt || true
          echo "Changed Python files:"; cat existing_py.txt
      - name: Ruff (changed files must be clean)
        run: |
          if [ -s existing_py.txt ]; then
            xargs -a existing_py.txt ruff check
          else
            echo "No changed Python files under apps/ or hotel/ — ruff skipped"
          fi
      - name: Black format check (changed files)
        run: |
          if [ -s existing_py.txt ]; then
            xargs -a existing_py.txt black --check
          else
            echo "No changed Python files under apps/ or hotel/ — black check skipped"
          fi

  type-check:
    # mypy 基线门禁（治理 V1.1 第二阶段，P-04）：存量错误冻结于 mypy-baseline.txt，
    # 仅拦截"新增"错误；存量清偿后由 scripts/mypy_baseline.py generate 重新收紧。
    # 禁止清空/手改基线文件伪造通过（基线变更须随真实清偿提交并说明范围）。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Mypy baseline check (new errors are blocking)
        run: python scripts/mypy_baseline.py check

  test:
    runs-on: ubuntu-24.04
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DB_ENGINE: sqlite
      DJANGO_DB_NAME: ":memory:"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DEFAULT_PROPERTY_CODE: DEFAULT
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      # ARCH-10：模块依赖方向门禁（L1 core 不得依赖 api；L2 业务代码不得从 migrations 导入）。
      # 规则只覆盖确定不可违反的两条，完整依赖图用 `python scripts/arch_gate.py graph` 人工审查；
      # 违规即非零退出阻断。脚本 fail-closed：读取失败同样不会当作通过。
      - name: Architecture dependency gate
        run: python scripts/arch_gate.py check
      - name: Run tests
        run: python manage.py test --verbosity 2

  docs-lint:
    # 文档治理阶段三批次 5：docs 门禁（C1 断链/C2 元数据/C4 重复/C5 SHA 可解析/C6 证据保护；
    # C7 追加节仅警告）。存量违规冻结于 docs/共享规范/docs_gate_baseline.json，仅拦新增；
    # 基线更新须与修复同一提交（修一条删一条），禁止清空基线伪造通过。
    # fetch-depth: 0 —— C5 需在完整历史上 cat-file 解析文档引用的提交 SHA。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Docs gate check (new violations are blocking)
        run: python scripts/docs_link_check.py check
