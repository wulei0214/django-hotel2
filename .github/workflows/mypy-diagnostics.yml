name: Temporary mypy diagnostics

on:
  pull_request:
    branches:
      - main

jobs:
  mypy-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Show Ruff import-order fix diff
        run: ruff check --fix --diff apps/api/report_center.py apps/api/test_partial_contract_verification.py
      - name: Show Black formatting diff
        run: black --diff apps/api/report_center.py apps/api/test_partial_contract_verification.py apps/guests/management/commands/merge_guests.py apps/guests/models.py apps/guests/test_merge_guests.py apps/reservations/management/commands/backfill_nightly_rates.py apps/reservations/models.py
      - name: Print full mypy diagnostics
        run: python -m mypy apps/ --show-error-codes --show-column-numbers
