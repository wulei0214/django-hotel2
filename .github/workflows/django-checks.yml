name: Django checks and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_DB_ENGINE: sqlite
      DJANGO_DB_NAME: ${{ runner.temp }}/hotel-ci.sqlite3
      DJANGO_TIME_ZONE: Asia/Shanghai
      DEFAULT_PROPERTY_CODE: DEFAULT
      PAYMENT_WEBHOOK_SECRET: ci-only-webhook-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Run test suite
        run: python manage.py test --verbosity 2
