name: OpenAPI snapshot

on:
  push:
    branches: [main]
    paths:
      - "apps/api/openapi_schema.py"
      - "apps/api/urls.py"
      - "apps/api/management/commands/export_openapi_schema.py"
      - ".github/workflows/openapi-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-openapi:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Export current runtime schema
        run: |
          python manage.py export_openapi_schema
          cp docs/PMS2.0_当前版本/03_API接口与前后端规范/接口文档/openapi.json docs/接口文档/openapi.json
      - name: Commit refreshed OpenAPI snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PMS2.0_当前版本/03_API接口与前后端规范/接口文档/openapi.json docs/接口文档/openapi.json
          if git diff --cached --quiet; then
            echo "OpenAPI snapshots are already current."
          else
            git commit -m "docs(api): refresh synchronized OpenAPI snapshots"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Upload generated OpenAPI snapshots
        uses: actions/upload-artifact@v4
        with:
          name: pms2-openapi-snapshots
          path: |
            docs/PMS2.0_当前版本/03_API接口与前后端规范/接口文档/openapi.json
            docs/接口文档/openapi.json
          if-no-files-found: error
          retention-days: 7
