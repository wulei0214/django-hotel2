name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  django-tests:
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hotel_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "1"
      DJANGO_ENV: test
      DJANGO_DB_ENGINE: mysql
      DJANGO_DB_NAME: hotel_ci
      DJANGO_DB_USER: root
      DJANGO_DB_PASSWORD: root
      DJANGO_DB_HOST: 127.0.0.1
      DJANGO_DB_PORT: "3306"
      PAYMENT_WEBHOOK_SECRET: ci-only-webhook-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run test suite
        run: python manage.py test --noinput -v 2

      # Test database is destroyed after the suite; install production-style guards
      # on the migrated MySQL CI database and verify all seven trigger definitions (six append-only guards plus one open-shift insert guard).
      - name: Install MySQL append-only guards
        run: python manage.py install_mysql_append_only_guards

      - name: Verify MySQL append-only guards
        run: python manage.py check_mysql_append_only_guards

      # 迁移方案 §5.2 数据库层（阶段 D 批次 3）：ACTIVE 批次 scope 冻结 / CLOSED 终态 /
      # 状态白名单 / 删除拒绝。SQLite 测试环境无触发器，故只能在此真实 MySQL 步骤验收。
      - name: Install legacy migration batch guards
        run: python manage.py install_legacy_batch_guards

      - name: Verify legacy migration batch guards
        run: python manage.py check_legacy_batch_guards

      # 迁移方案 §1.5.2 数据库层（阶段 D 批次 4）：旧订单-新预订关系映射
      # 追加式不可变（UPDATE / DELETE 一律拒绝）。同样只能在真实 MySQL 验收。
      - name: Install legacy order-reservation map guards
        run: python manage.py install_legacy_map_guards

      - name: Verify legacy order-reservation map guards
        run: python manage.py check_legacy_map_guards
