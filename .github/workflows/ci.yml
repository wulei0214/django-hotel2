name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  django-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hotel_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "1"
      DJANGO_ENV: test
      DJANGO_DB_ENGINE: mysql
      DJANGO_DB_NAME: hotel_ci
      DJANGO_DB_USER: root
      DJANGO_DB_PASSWORD: root
      DJANGO_DB_HOST: 127.0.0.1
      DJANGO_DB_PORT: "3306"
      PAYMENT_WEBHOOK_SECRET: ci-only-webhook-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run test suite
        run: python manage.py test --noinput -v 2
